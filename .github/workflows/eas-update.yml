name: EAS OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/flow/**'
      - 'packages/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update Channel'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      message:
        description: 'Update commit / release message'
        required: false
        default: 'Manual OTA update trigger'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Check out git repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 🚀 Install EAS CLI
        run: npm install --global eas-cli

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📱 Publish OTA Update to Expo
        working-directory: artifacts/flow
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: '1'
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'production' }}"
          MESSAGE="${{ github.event.inputs.message || github.event.head_commit.message || 'OTA update from GitHub Actions' }}"
          eas update --channel "$CHANNEL" --environment "$CHANNEL" --message "$MESSAGE" --non-interactive
